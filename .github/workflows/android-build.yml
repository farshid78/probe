name: Bastehyab APK Build and Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bastehyab-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Debug APK (no tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Android source archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(git ls-files '*.zip')
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one committed Android source ZIP; found ${#archives[@]}"
            exit 1
          fi

          extract_dir="$RUNNER_TEMP/bastehyab-source"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "${archives[0]}" -d "$extract_dir"

          mapfile -t settings_files < <(
            find "$extract_dir" -type f -name settings.gradle -not -path '*/__MACOSX/*'
          )
          if [[ "${#settings_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle inside the source ZIP; found ${#settings_files[@]}"
            exit 1
          fi

          project_dir="$(dirname "${settings_files[0]}")"
          cp -a "$project_dir/." "$GITHUB_WORKSPACE/"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f version.properties

          echo "Extracted Android project from ${archives[0]}"

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/bootstrap-wrapper.sh

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build Debug APK only
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK and checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test -n "$VERSION_NAME"

          mkdir -p dist
          cp "$APK" dist/Bastehyab-Debug.apk
          sha256sum dist/Bastehyab-Debug.apk > dist/Bastehyab-Debug-SHA256.txt

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ steps.apk.outputs.version_name }}"
          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          TITLE="Bastehyab ${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})"

          cat > release-notes.md <<EOF
          Automated Debug APK build.

          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          gh release create "$TAG" \
            dist/Bastehyab-Debug.apk \
            dist/Bastehyab-Debug-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --prerelease

          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Bastehyab APK Release"
            echo "- Release: [$TAG]($RELEASE_URL)"
            echo "- APK asset: Bastehyab-Debug.apk"
            echo "- Checksum asset: Bastehyab-Debug-SHA256.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bastehyab APK Build"
            echo "- Build mode: Debug APK only"
            echo "- Automated tests: skipped"
            echo "- Android emulator: not used"
            echo "- APK delivery: GitHub Releases (not Actions Artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
