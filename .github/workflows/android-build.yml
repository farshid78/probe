name: Bastehyab APK Build Only

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bastehyab-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Debug APK (no tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Android source archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(git ls-files '*.zip')
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one committed Android source ZIP; found ${#archives[@]}"
            exit 1
          fi

          extract_dir="$RUNNER_TEMP/bastehyab-source"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "${archives[0]}" -d "$extract_dir"

          mapfile -t settings_files < <(
            find "$extract_dir" -type f -name settings.gradle -not -path '*/__MACOSX/*'
          )
          if [[ "${#settings_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle inside the source ZIP; found ${#settings_files[@]}"
            exit 1
          fi

          project_dir="$(dirname "${settings_files[0]}")"
          cp -a "$project_dir/." "$GITHUB_WORKSPACE/"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f version.properties

          echo "Extracted Android project from ${archives[0]}"

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/bootstrap-wrapper.sh

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build Debug APK only
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK and checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test -n "$VERSION_NAME"

          mkdir -p dist
          cp "$APK" dist/Bastehyab-Debug.apk
          sha256sum dist/Bastehyab-Debug.apk > dist/Bastehyab-Debug-SHA256.txt

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bastehyab-Debug-${{ steps.apk.outputs.version_name }}-${{ github.run_number }}
          path: |
            dist/Bastehyab-Debug.apk
            dist/Bastehyab-Debug-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bastehyab APK Build"
            echo "- Build mode: Debug APK only"
            echo "- Automated tests: skipped"
            echo "- Android emulator: not used"
          } >> "$GITHUB_STEP_SUMMARY"
