name: Bastehyab Android CI and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bastehyab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Extract source, static checks, unit tests and Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find and extract the source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(git ls-files '*.zip')
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one committed .zip archive, found ${#zips[@]}: ${zips[*]:-none}"
            exit 1
          fi
                    SRC="$GITHUB_WORKSPACE/_src""
          rm -rf "$SRC"
          mkdir -p "$SRC"
          unzip -q "${zips[0]}" -d "$SRC"
          mapfile -t settings < <(find "$SRC" -name settings.gradle -not -path '*/__MACOSX/*')
          if [ "${#settings[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one settings.gradle in the archive, found ${#settings[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${settings[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Archive: ${zips[0]}"
          echo "Project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install project Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Verify project and compute versionCode
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          gradle --version
          grep -q "com.android.application.*8.5.2" build.gradle
          grep -q "compileSdk 34" app/build.gradle
          grep -q "applicationId 'app.bastehyab'" app/build.gradle
          VERSION_CODE=$((1000000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Computed Android versionCode exceeds the supported ceiling."
            exit 1
          fi
          echo "BH_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Build versionCode: $VERSION_CODE"

      - name: Run project smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash tools/fixture-sanitizer/test.sh
          bash tools/parser-smoke-tests/run.sh
          bash tools/android-core-smoke-tests/run.sh
          bash tools/popup-overlay-smoke-tests/run.sh
          bash tools/ui-layout-smoke-tests/run.sh

      - name: Android Lint, unit tests and Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Collect Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Bastehyab-Debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/Bastehyab-Debug.apk" > "$GITHUB_WORKSPACE/dist/Bastehyab-Debug-SHA256.txt"

      - name: Upload Debug artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bastehyab-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/Bastehyab-Debug.apk
            dist/Bastehyab-Debug-SHA256.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed Release (protected main only)
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Find and extract the source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(git ls-files '*.zip')
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one committed .zip archive, found ${#zips[@]}: ${zips[*]:-none}"
            exit 1
          fi
          SRC="$RUNNER_TEMP/src"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          unzip -q "${zips[0]}" -d "$SRC"
          mapfile -t settings < <(find "$SRC" -name settings.gradle -not -path '*/__MACOSX/*')
          if [ "${#settings[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one settings.gradle in the archive, found ${#settings[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${settings[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install project Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Compute release version code
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Computed Android versionCode exceeds the supported ceiling."
            exit 1
          fi
          echo "BH_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Release versionCode: $VERSION_CODE"

      - name: Validate versionCode against latest published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false) | select(.isPrerelease == false)][0].tagName // ""')"
          if [ -z "$LATEST_TAG" ]; then
            echo "No earlier Bastehyab release found; versionCode baseline accepted."
            exit 0
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not configured."
            exit 1
          fi
          export PATH="$SDK_ROOT/build-tools/34.0.0:$PATH"
          PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
          mkdir -p "$PREVIOUS_DIR"
          if ! gh release download "$LATEST_TAG" --pattern 'Bastehyab-Release.apk' --dir "$PREVIOUS_DIR"; then
            echo "::error::Could not retrieve the latest published APK to validate versionCode."
            exit 1
          fi
          PREVIOUS_CODE="$(aapt dump badging "$PREVIOUS_DIR/Bastehyab-Release.apk" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
          if [ -z "$PREVIOUS_CODE" ]; then
            echo "::error::Could not read previous Release versionCode."
            exit 1
          fi
          if [ "$BH_VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
            echo "::error::New versionCode ($BH_VERSION_CODE) must exceed published ($PREVIOUS_CODE)."
            exit 1
          fi
          echo "Published code $PREVIOUS_CODE -> candidate $BH_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets missing:$missing"
            exit 1
          fi

      - name: Prepare temporary signing properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/bastehyab-release.jks
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def esc(value):
              out=[]
              for i,ch in enumerate(value):
                  n=ord(ch)
                  if ch == "\\": out.append("\\\\")
                  elif ch == "\t": out.append("\\t")
                  elif ch == "\n": out.append("\\n")
                  elif ch == "\r": out.append("\\r")
                  elif ch == "\f": out.append("\\f")
                  elif ch in "=:# !" and (ch != " " or i == 0): out.append("\\"+ch)
                  elif n < 0x20 or n > 0x7e:
                      b=ch.encode("utf-16-be")
                      if len(b)==2: out.append(f"\\u{int.from_bytes(b,'big'):04x}")
                      else: out.append(f"\\u{int.from_bytes(b[:2],'big'):04x}\\u{int.from_bytes(b[2:],'big'):04x}")
                  else: out.append(ch)
              return "".join(out)
          values={
              "storeFile": os.environ["KEYSTORE_PATH"],
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          target = Path(os.environ["PROJECT_DIR"], "keystore.properties")
          target.write_bytes(("\n".join(f"{k}={esc(v)}" for k,v in values.items())+"\n").encode("ascii"))
          PY

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -s keystore.properties
          gradle --no-daemon --stacktrace clean :app:assembleRelease
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk"

      - name: Verify signed Release APK and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not configured."
            exit 1
          fi
          BUILD_TOOLS="$SDK_ROOT/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/bastehyab-badging.txt"
          grep -q "name='app.bastehyab'" "$RUNNER_TEMP/bastehyab-badging.txt"
          grep -q "versionCode='$BH_VERSION_CODE'" "$RUNNER_TEMP/bastehyab-badging.txt"
          sha256sum "$APK" > "$GITHUB_WORKSPACE/dist/SHA256.txt"
          TAG="bastehyab-build-${GITHUB_RUN_NUMBER}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<NOTES
          نسخهٔ Release بسته‌یاب 1.9.0

          - versionCode: $BH_VERSION_CODE
          - Android minSdk: 24
          - APK با کلید انتشار پروژه امضا و با apksigner بررسی شده است.
          - خروجی Debug برای نصب به‌عنوان به‌روزرسانی Release مناسب نیست.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$GITHUB_WORKSPACE/dist/SHA256.txt" --clobber
            gh release edit "$TAG" --title "Bastehyab 1.9.0 build ${GITHUB_RUN_NUMBER}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" "$GITHUB_WORKSPACE/dist/SHA256.txt" \
              --title "Bastehyab 1.9.0 build ${GITHUB_RUN_NUMBER}" \
              --notes-file "$NOTES"
          fi

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${PROJECT_DIR:-}" ]; then rm -f "$PROJECT_DIR/keystore.properties"; fi
          rm -f "$RUNNER_TEMP/bastehyab-release.jks"
