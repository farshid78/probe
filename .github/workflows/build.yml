
name: Bastehyab Android Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bastehyab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test, Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # پیدا کردن پروژه؛ اولویت با سورس استخراج‌شده است.
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mapfile -t SETTINGS_FILES < <(
              find . -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path './.git/*' \
                -not -path '*/build/*' \
                -not -path '*/.gradle/*' | sort
            )

            if [[ ${#SETTINGS_FILES[@]} -eq 1 ]]; then
              PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

            elif [[ ${#SETTINGS_FILES[@]} -gt 1 ]]; then
              echo "Multiple Android projects found:"
              printf '%s\n' "${SETTINGS_FILES[@]}"
              echo "Please keep only the intended project or configure its path."
              exit 1

            else
              echo "No extracted Android project found."

              mapfile -t R3_ZIPS < <(
                find . -maxdepth 5 -type f \
                  -name '*fixed-r3*.zip' \
                  -not -path './.git/*' | sort
              )

              if [[ ${#R3_ZIPS[@]} -eq 1 ]]; then
                ZIP_FILE="${R3_ZIPS[0]}"
              else
                mapfile -t ZIP_FILES < <(
                  find . -maxdepth 5 -type f \
                    -name '*.zip' \
                    -not -path './.git/*' | sort
                )

                if [[ ${#ZIP_FILES[@]} -eq 1 ]]; then
                  ZIP_FILE="${ZIP_FILES[0]}"
                else
                  echo "Could not uniquely identify the source ZIP."
                  printf '%s\n' "${ZIP_FILES[@]}"
                  exit 1
                fi
              fi

              echo "Selected source: $ZIP_FILE"

              rm -rf _src
              mkdir -p _src
              unzip -q "$ZIP_FILE" -d _src

              mapfile -t SETTINGS_FILES < <(
                find _src -type f \
                  \( -name settings.gradle -o -name settings.gradle.kts \) \
                  -not -path '*/build/*' | sort
              )

              if [[ ${#SETTINGS_FILES[@]} -ne 1 ]]; then
                echo "Expected exactly one Android project in ZIP."
                printf '%s\n' "${SETTINGS_FILES[@]}"
                exit 1
              fi

              PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" &&
                ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "app/build.gradle is missing."
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Verify environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "Project directory:"
          pwd
          ls -la

      # شماره نسخه همیشه از نسخه قبلی پروژه بالاتر خواهد بود.
      - name: Test and Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          export BH_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          echo "Version code: $BH_VERSION_CODE"

          gradle --no-daemon --stacktrace \
            testDebugUnitTest \
            assembleDebug

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)"

          if [[ -z "$APK" || ! -f "$APK" ]]; then
            echo "Debug APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Bastehyab-Debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bastehyab-debug-apk
          path: dist/Bastehyab-Debug.apk
          if-no-files-found: error
          retention-days: 14

      # امضای نسخه Release فقط روی main انجام می‌شود.
      - name: Validate signing secrets
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$KEYSTORE_BASE64" ]] || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$KEYSTORE_PASSWORD" ]] || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Missing KEY_ALIAS"; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Missing KEY_PASSWORD"; exit 1; }

      - name: Prepare keystore
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/bastehyab-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

          chmod 600 keystore.properties

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          export BH_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          gradle --no-daemon --stacktrace clean assembleRelease

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"

          if [[ -z "$APK" || ! -f "$APK" ]]; then
            echo "Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk"

      - name: Verify Release APK
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          test -f "$APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose --print-certs "$APK"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/badging.txt"

          grep -F "name='app.bastehyab'" "$RUNNER_TEMP/badging.txt"

          sha256sum "$APK" > "$GITHUB_WORKSPACE/dist/SHA256.txt"

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: bastehyab-release-signed-apk
          path: |
            dist/Bastehyab-Release.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: bastehyab-build-${{ github.run_number }}
          name: Bastehyab Release Build ${{ github.run_number }}
          body: نسخه Release بسته‌یاب
          prerelease: false
          files: |
            dist/Bastehyab-Release.apk
            dist/SHA256.txt
          generate_release_notes: true

      - name: Cleanup signing files
        if: always()
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          if [[ -n "${PROJECT_DIR:-}" ]]; then
            rm -f "$PROJECT_DIR/keystore.properties"
          fi

          rm -f "$RUNNER_TEMP/bastehyab-release.jks"
