name: Bastehyab Android Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bastehyab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test, Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1) دریافت سورس مخزن خصوصی
      - name: Checkout source
        uses: actions/checkout@v7

      # 2) نصب Java مطابق Android Gradle Plugin 8.5.2
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3) نصب Android SDK بدون نیاز به Android Studio
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 4) پیدا کردن پروژه؛ پوشه سورس اولویت دارد، ZIP فقط در نبود پوشه استفاده می‌شود
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find "$1" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.git/*' \
              -not -path '*/build/*' \
              -not -path '*/_src/*' \
              | sort | head -n 1 || true
          }

          SETTINGS="$(find_settings .)"

          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found in repository root. Looking for ZIP files..."

            mapfile -t ZIPS < <(
              find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' | sort
            )

            echo "Found ZIP files:"
            printf '  - %s\n' "${ZIPS[@]:-<none>}"

            CANDIDATES=()
            for z in "${ZIPS[@]}"; do
              echo ""
              echo "Inspecting ZIP: $z"
              echo "----------------------------------------"
              unzip -l "$z" 2>/dev/null | head -40 || echo "(could not list ZIP contents)"
              echo "----------------------------------------"

              # بررسی وجود settings.gradle یا settings.gradle.kts
              if unzip -l "\( z" 2>/dev/null | grep -qE '(^|/)(settings\.gradle(\.kts)?) \)'; then
                echo "✓ Found settings.gradle inside $z"
                CANDIDATES+=("$z")
              else
                echo "✗ No settings.gradle found inside $z"
              fi
            done

            if [ "${#CANDIDATES[@]}" -eq 0 ]; then
              echo "::error::No ZIP containing settings.gradle was found."
              echo "Please make sure the ZIP has a valid Android project structure."
              exit 1
            fi

            if [ "${#CANDIDATES[@]}" -gt 1 ]; then
              echo "::error::Found more than one valid ZIP. Expected exactly one."
              printf 'Valid ZIPs: %s\n' "${CANDIDATES[@]}"
              exit 1
            fi

            echo "Using ZIP: ${CANDIDATES[0]}"
            rm -rf _src
            mkdir -p _src
            unzip -q -o "${CANDIDATES[0]}" -d _src
            SETTINGS="$(find_settings _src)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android Gradle project not found after extraction."
            echo "Contents of _src:"
            find _src -maxdepth 4 -type f | head -50 || true
            exit 1
          fi

          PROJECT_DIR="\( (realpath " \)(dirname "$SETTINGS")")"
          
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The detected project does not contain app/build.gradle(.kts)."
            echo "PROJECT_DIR = $PROJECT_DIR"
            ls -la "$PROJECT_DIR" || true
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      # 5) نصب دقیق Gradle 8.7 (بعد از پیدا شدن پروژه)
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic
          build-root-directory: ${{ env.PROJECT_DIR }}

      # 6) کنترل نسخه ابزارها و تنظیمات پروژه
      - name: Verify build toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          grep -q "com.android.application.*8.5.2" build.gradle
          grep -q "compileSdk 34" app/build.gradle
          grep -q "applicationId 'app.bastehyab'" app/build.gradle
          echo "Project toolchain matches: JDK 17 / Gradle 8.7 / AGP 8.5.2 / SDK 34."

      # 7) تست‌های پارسر، موتور اصلی و چیدمان RTL
      - name: Run parser, core and UI layout smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/parser-smoke-tests/run.sh
          bash tools/android-core-smoke-tests/run.sh
          bash tools/ui-layout-smoke-tests/run.sh

      # 8) ساخت APK آزمایشی روی همه شاخه‌ها
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Bastehyab-Debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bastehyab-debug-apk
          path: dist/Bastehyab-Debug.apk
          if-no-files-found: error
          retention-days: 14

      # 9) فقط روی main نسخه Release امضاشده ساخته می‌شود.
      # چهار مقدار زیر باید در Settings > Secrets and variables > Actions تعریف شده باشند.
      - name: Validate release signing secrets
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Secret $name is missing."
              exit 1
            fi
          done

      # 10) ساخت فایل keystore موقت و keystore.properties موردنیاز همین سورس
      - name: Prepare release keystore properties
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/bastehyab-release.jks
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/bastehyab-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # فایل با قواعد Java Properties نوشته می‌شود تا کاراکترهای ویژه رمز خراب نشوند.
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              out = []
              for index, char in enumerate(value):
                  code = ord(char)
                  if char == "\\":
                      out.append("\\\\")
                  elif char == "\t":
                      out.append("\\t")
                  elif char == "\n":
                      out.append("\\n")
                  elif char == "\r":
                      out.append("\\r")
                  elif char == "\f":
                      out.append("\\f")
                  elif char in "=:#!" or (index == 0 and char == " "):
                      out.append("\\" + char)
                  elif code < 0x20 or code > 0x7E:
                      if code <= 0xFFFF:
                          out.append(f"\\u{code:04x}")
                      else:
                          value16 = char.encode("utf-16-be")
                          hi = int.from_bytes(value16[:2], "big")
                          lo = int.from_bytes(value16[2:], "big")
                          out.append(f"\\u{hi:04x}\\u{lo:04x}")
                  else:
                      out.append(char)
              return "".join(out)

          values = {
              "storeFile": os.environ["KEYSTORE_PATH"],
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          content = "\n".join(f"{key}={escape_property(value)}" for key, value in values.items()) + "\n"
          Path("keystore.properties").write_bytes(content.encode("ascii"))
          PY

      # 11) Gradle خود پروژه Release را با همین کلید امضا می‌کند
      - name: Build signed Release APK
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s keystore.properties
          gradle --no-daemon --stacktrace clean assembleRelease

          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk"

      # 12) کنترل امضا، تراز APK، شناسه برنامه و نسخه
      - name: Verify signed Release APK
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk"
          SDK_ROOT="\( {ANDROID_HOME:- \){ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is not configured."
            exit 1
          fi
          BUILD_TOOLS="$SDK_ROOT/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/bastehyab-apk-badging.txt"

          grep -q "name='app.bastehyab'" "$RUNNER_TEMP/bastehyab-apk-badging.txt"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/dist/SHA256.txt"

      - name: Upload signed Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bastehyab-release-signed-apk
          path: |
            dist/Bastehyab-Release.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # 13) انتشار خودکار در GitHub Releases؛ فایل Release امضاشده است، نه Debug
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bastehyab-build-${{ github.run_number }}
          name: Bastehyab Release Build ${{ github.run_number }}
          body: |
            نسخه Release بسته‌یاب.

            APK با کلید اختصاصی انتشار امضا و با apksigner بررسی شده است.
            فایل Debug صرفاً برای آزمایش است و برای انتشار در کافه‌بازار استفاده نشود.
          prerelease: false
          files: |
            dist/Bastehyab-Release.apk
            dist/SHA256.txt
          generate_release_notes: true

      # 14) پاک‌کردن کلید موقت و فایل رمزها حتی در صورت شکست Build
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${PROJECT_DIR:-}" ]; then
            rm -f "$PROJECT_DIR/keystore.properties"
          fi
          rm -f "$RUNNER_TEMP/bastehyab-release.jks"
          rm -f "$RUNNER_TEMP/bastehyab-aligned.apk"
