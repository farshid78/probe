name: Bastehyab Android Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bastehyab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # 1) A project folder already in the repository (preferred).
          find_settings() {
            find "$1" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -not -path '*/build/*' -not -path '*/_src/*' \
              | sort | head -n 1 || true
          }

          SETTINGS=$(find_settings .)

          # 2) Otherwise, a project ZIP that really contains a Gradle project.
          if [ -z "$SETTINGS" ]; then
            mapfile -t ZIPS < <(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' | sort)
            CANDIDATES=()
            for z in "${ZIPS[@]}"; do
              if unzip -Z1 "$z" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
                CANDIDATES+=("$z")
              else
                echo "Ignoring ZIP without a Gradle project: $z"
              fi
            done

            if [ "${#CANDIDATES[@]}" -ne 1 ]; then
              echo "Expected exactly one ZIP containing a Gradle project; found ${#CANDIDATES[@]}."
              echo "ZIP files seen in the repository:"
              printf '  %s\n' "${ZIPS[@]:-<none>}"
              echo "Fix: commit the project folder (bastehyab-v1.2-creator-ui/) instead of a ZIP,"
              echo "or make sure the ZIP contains settings.gradle."
              exit 1
            fi

            echo "Extracting: ${CANDIDATES[0]}"
            rm -rf _src && mkdir -p _src
            unzip -q -o "${CANDIDATES[0]}" -d _src
            SETTINGS=$(find_settings _src)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "Android Gradle project not found after extraction."
            exit 1
          fi

          PROJECT_DIR=$(realpath "$(dirname "$SETTINGS")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Run parser and core smoke tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          bash tools/parser-smoke-tests/run.sh
          bash tools/android-core-smoke-tests/run.sh

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          echo "APK_PATH=$(realpath "$APK")" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastehyab-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bastehyab-build-${{ github.run_number }}
          name: Bastehyab Debug Build ${{ github.run_number }}
          body: |
            Debug build for testing only (signed with the default debug key). Not for Google Play or Cafe Bazaar.
          prerelease: true
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
