name: Bastehyab Android Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bastehyab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test, Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Locate Android project
        id: project
        run: |
          echo "Looking for settings.gradle"

          SETTINGS=""

          if [ -f settings.gradle ]; then
            SETTINGS=settings.gradle
          fi

          if [ -z "$SETTINGS" ]; then
            echo "Extracting ZIP..."
            ZIP_FILE=`find . -maxdepth 2 -name "*.zip" | head -n 1`
            echo "ZIP = $ZIP_FILE"

            rm -rf _src
            mkdir _src
            unzip -q -o "$ZIP_FILE" -d _src

            SETTINGS=`find _src -name settings.gradle | head -n 1`
          fi

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            find _src -name "*.gradle*" 
            exit 1
          fi

          echo "Found settings at $SETTINGS"
          PROJECT_DIR=`dirname $SETTINGS`
          echo "Project dir = $PROJECT_DIR"

          if [ ! -f $PROJECT_DIR/app/build.gradle ]; then
            echo "app/build.gradle missing"
            ls -la $PROJECT_DIR
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project is ready"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Verify
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version
          pwd
          ls -la

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          APK=`find app/build/outputs/apk/debug -name "*.apk" | head -n 1`
          echo "APK = $APK"
          mkdir -p $GITHUB_WORKSPACE/dist
          cp "$APK" $GITHUB_WORKSPACE/dist/Bastehyab-Debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bastehyab-debug-apk
          path: dist/Bastehyab-Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate secrets
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing KEYSTORE_BASE64"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Missing KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "Missing KEY_ALIAS"; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "Missing KEY_PASSWORD"; exit 1; fi

      - name: Prepare keystore
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/bastehyab-release.jks
          echo "$KEYSTORE_BASE64" | base64 --decode > $KEYSTORE_PATH
          chmod 600 $KEYSTORE_PATH
          echo "storeFile=$KEYSTORE_PATH" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease
          APK=`find app/build/outputs/apk/release -name "*.apk" | head -n 1`
          mkdir -p $GITHUB_WORKSPACE/dist
          cp "$APK" $GITHUB_WORKSPACE/dist/Bastehyab-Release.apk

      - name: Verify Release
        if: github.ref == 'refs/heads/main'
        run: |
          APK=$GITHUB_WORKSPACE/dist/Bastehyab-Release.apk
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          $BUILD_TOOLS/apksigner verify --verbose --print-certs $APK
          $BUILD_TOOLS/zipalign -c -v 4 $APK
          $BUILD_TOOLS/aapt dump badging $APK | tee $RUNNER_TEMP/badging.txt
          grep "name='app.bastehyab'" $RUNNER_TEMP/badging.txt
          sha256sum $APK > $GITHUB_WORKSPACE/dist/SHA256.txt

      - name: Upload Release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bastehyab-release-signed-apk
          path: |
            dist/Bastehyab-Release.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bastehyab-build-${{ github.run_number }}
          name: Bastehyab Release Build ${{ github.run_number }}
          body: نسخه Release بسته‌یاب
          prerelease: false
          files: |
            dist/Bastehyab-Release.apk
            dist/SHA256.txt
          generate_release_notes: true

      - name: Cleanup
        if: always()
        run: |
          rm -f $PROJECT_DIR/keystore.properties || true
          rm -f $RUNNER_TEMP/bastehyab-release.jks || true
