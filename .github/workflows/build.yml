# 4) پیدا کردن پروژه
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Listing all ZIP files ==="
          find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' | sort

          echo ""
          echo "=== Searching for settings.gradle inside ZIP ==="
          for z in $(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*'); do
            echo "----- ZIP: $z -----"
            unzip -l "$z" | grep -i settings || echo "(no settings* file found)"
            echo ""
            unzip -l "$z" | grep -i "\.gradle" || echo "(no .gradle files found)"
            echo ""
          done

          echo "=== Done ==="
          exit 1   # عمداً خطا می‌دهیم تا فقط لاگ را ببینیم
